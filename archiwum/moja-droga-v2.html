<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Moja Droga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── SECTION-SPECIFIC PALETTE (light) ── */
#app[data-sect="islam"]{--bg:#F4EFE6;--bg-panel:#FDFAF5;--accent:#A9762F;--accent-soft:rgba(169,118,47,0.11);}
#app[data-sect="eng"]  {--bg:#F5F8FD;--bg-panel:#FFFFFF;--accent:#3A6FC2;--accent-soft:rgba(58,111,194,0.11);--b2:#6B4AC2;--b2-soft:rgba(107,74,194,0.11);}
/* ── SHARED LIGHT ── */
:root{--text:#1A2820;--text-muted:#6B7A6F;--border:rgba(26,40,32,0.13);--scale:1;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
/* ── DARK SHARED ── */
[data-theme="dark"]{--text:#EAE4D6;--text-muted:#8A9E94;--border:rgba(234,228,214,0.11);}
/* ── DARK SECTION ── */
[data-theme="dark"] #app[data-sect="islam"]{--bg:#0E1C18;--bg-panel:#142018;--accent:#C79A46;--accent-soft:rgba(199,154,70,0.14);}
[data-theme="dark"] #app[data-sect="eng"]  {--bg:#0D1117;--bg-panel:#161B22;--accent:#6B9ED4;--accent-soft:rgba(107,158,212,0.16);--b2:#9F82D8;--b2-soft:rgba(159,130,216,0.16);}
/* ── RESET ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overscroll-behavior:none;}
#app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;background:var(--bg);}
.view{display:none;flex:1;min-height:0;flex-direction:column;}.view.active{display:flex;}
/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:11px 16px 9px;gap:8px;border-bottom:1px solid var(--border);background:var(--bg-panel);flex-shrink:0;}
.tb-title{font-size:calc(13px * var(--scale));font-weight:700;}
.tb-right{display:flex;align-items:center;gap:5px;}
.pill{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.pill button{background:none;border:none;border-right:1px solid var(--border);padding:5px 9px;cursor:pointer;color:var(--text-muted);font-family:'Inter',sans-serif;font-weight:600;font-size:11px;}
.pill button:last-child{border-right:none;}
.pill button.on{background:var(--accent-soft);color:var(--accent);}
.sz-btn{font-weight:700!important;}
.icon-btn{background:none;border:none;color:var(--text-muted);font-size:14px;padding:5px 6px;cursor:pointer;line-height:1;}
.icon-btn:active{color:var(--accent);}
/* ── HOME HEADER ── */
.home-hdr{padding:14px 18px 6px;flex-shrink:0;}
.home-title{font-size:calc(19px * var(--scale));font-weight:700;margin:0;letter-spacing:-0.02em;}
.home-sub{font-size:calc(11px * var(--scale));color:var(--text-muted);margin:3px 0 0;}
/* ── PRAYER WIDGET ── */
.pw{margin:10px 18px 6px;padding:9px 11px 11px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;flex-shrink:0;}
.pw-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pw-city{background:none;border:none;padding:0;cursor:pointer;color:var(--text);font-family:'Inter',sans-serif;font-size:calc(12px * var(--scale));font-weight:700;}
.pw-city::after{content:' ›';color:var(--accent);}
.pw-method{font-size:calc(9px * var(--scale));color:var(--text-muted);}
.pw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;}
.pw-cell{text-align:center;padding:3px 1px;border-radius:3px;}.pw-cell.on{background:var(--accent-soft);}.pw-cell.dim{opacity:0.4;}
.pw-l{font-size:calc(8.5px * var(--scale));color:var(--text-muted);line-height:1;}.pw-cell.on .pw-l{color:var(--accent);font-weight:600;}
.pw-v{font-size:calc(11.5px * var(--scale));font-weight:700;margin-top:3px;line-height:1;}.pw-cell.on .pw-v{color:var(--accent);}
/* ── LIST HEADER ── */
.list-hdr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 18px 3px;flex-shrink:0;}
.list-hdr-lbl{font-size:calc(9.5px * var(--scale));font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
.sort-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-size:13px;padding:3px 7px;cursor:pointer;}
/* ── ENTRY LIST ── */
.entry-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.entry-row{display:flex;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);gap:11px;cursor:pointer;}
.entry-row:active{background:var(--accent-soft);}
.e-num{font-size:calc(10.5px * var(--scale));color:var(--accent);font-weight:700;min-width:18px;text-align:right;flex-shrink:0;}
.e-ico{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
.e-body{flex:1;min-width:0;}
.e-title{font-size:calc(13.5px * var(--scale));font-weight:600;line-height:1.2;}
.e-sub{font-size:calc(11px * var(--scale));color:var(--text-muted);margin-top:1px;}
.e-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.e-pct{font-size:calc(9.5px * var(--scale));color:var(--text-muted);}
.prog-bar{width:36px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);transition:width 0.2s;}
.e-arr{color:var(--border);font-size:13px;}
/* ── SUB-TOP ── */
.sub-top{display:flex;align-items:center;gap:8px;padding:11px 16px 9px;border-bottom:1px solid var(--border);background:var(--bg-panel);flex-shrink:0;}
.sub-ttl{flex:1;font-size:calc(13.5px * var(--scale));font-weight:600;}
.back-btn{font-size:18px;color:var(--text-muted);background:none;border:none;padding:4px 6px;cursor:pointer;line-height:1;}
.back-btn:active{color:var(--accent);}
/* ── MINI BAR ── */
.mini-bar{font-size:calc(10px * var(--scale));color:var(--text-muted);padding:5px 18px;border-bottom:1px solid var(--border);line-height:1.4;flex-shrink:0;}
.mini-bar b{color:var(--accent);font-weight:600;}
/* ── DETAIL SCROLL ── */
.detail-scroll{flex:1;overflow-y:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch;}
.detail-title{font-size:calc(15px * var(--scale));font-weight:700;margin:10px 0 1px;}
.detail-sub{font-size:calc(10.5px * var(--scale));color:var(--text-muted);margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.line-item{padding:7px 0;border-bottom:1px solid var(--border);font-size:calc(13.5px * var(--scale));line-height:1.5;}
.line-item:last-child{border-bottom:none;}
.li-num{color:var(--accent);font-size:calc(10px * var(--scale));margin-right:5px;opacity:0.75;}
.li-hdr{font-weight:700;color:var(--accent);font-size:calc(10px * var(--scale));text-transform:uppercase;letter-spacing:0.04em;}
.li-meaning{color:var(--text-muted);font-size:calc(11.5px * var(--scale));margin-left:16px;}
/* ── ARABIC LETTERS ── */
.letter-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
.letter-row:last-child{border-bottom:none;}
.letter-ar{font-family:'Amiri',serif;font-size:calc(21px * var(--scale));width:32px;text-align:center;flex-shrink:0;color:var(--accent);}
.letter-lat{font-size:calc(13px * var(--scale));}
/* ── PRAYER ── */
.prayer-pills{display:flex;gap:6px;padding:7px 18px 5px;flex-shrink:0;}
.prayer-pills button{flex:1;border:1px solid var(--border);background:none;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:calc(10.5px * var(--scale));padding:5px 6px;border-radius:4px;cursor:pointer;}
.prayer-pills button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.pscroll{flex:1;overflow-y:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch;}
.sec-block{margin-bottom:4px;}.sec-block.hl{border-left:2px solid var(--accent);padding-left:10px;}
.sec-head{font-size:calc(9px * var(--scale));font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em;padding-top:7px;margin:0;}
.sec-block .line-item{font-size:calc(13px * var(--scale));padding:4px 0;}
/* ── ENGLISH — STATS BAR ── */
.stats-bar{margin:10px 18px 2px;padding:9px 10px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;flex-shrink:0;}
.s-cell{flex:1;text-align:center;}
.s-val{font-size:calc(14px * var(--scale));font-weight:700;line-height:1;color:var(--accent);}
.s-lbl{font-size:calc(9px * var(--scale));color:var(--text-muted);margin-top:2px;}
.s-div{width:1px;height:26px;background:var(--border);flex-shrink:0;}
/* ── ENGLISH — B1/B2 TAB BAR ── */
.tab-bar{display:flex;padding:8px 18px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.tab-btn{flex:1;border:1px solid var(--border);background:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:calc(12.5px * var(--scale));color:var(--text-muted);padding:7px 12px;border-radius:5px;transition:all 0.15s;}
.tab-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
/* ── ENGLISH — SECTION HEADER ── */
.topic-sec-hdr{font-size:calc(9px * var(--scale));font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);padding:10px 18px 2px;}
/* ── ENGLISH — ITEM ROWS ── */
.item-row{display:flex;align-items:flex-start;padding:10px 18px;border-bottom:1px solid var(--border);gap:10px;cursor:pointer;user-select:none;}
.item-row:active{opacity:0.7;}
.i-chk{flex-shrink:0;width:18px;height:18px;border:1.5px solid var(--border);border-radius:3px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:transparent;transition:all 0.12s;}
.i-chk.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.i-body{flex:1;min-width:0;}
.i-ttl{font-size:calc(13px * var(--scale));font-weight:600;line-height:1.3;}
.i-desc{font-size:calc(11.5px * var(--scale));color:var(--text-muted);margin-top:2px;line-height:1.45;}
.i-arr{color:var(--border);font-size:12px;flex-shrink:0;margin-top:2px;}
/* ── ENGLISH — ITEM DETAIL ── */
.id-scroll{flex:1;overflow-y:auto;padding:0 18px 30px;-webkit-overflow-scrolling:touch;}
.id-title{font-size:calc(17px * var(--scale));font-weight:700;margin:14px 0 6px;}
.id-desc{font-size:calc(13px * var(--scale));line-height:1.65;padding-bottom:14px;border-bottom:1px solid var(--border);}
.id-shdr{font-size:calc(9px * var(--scale));font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin:14px 0 8px;}
.id-ex{font-size:calc(13px * var(--scale));line-height:1.5;padding:7px 0 7px 12px;border-left:2px solid var(--accent-soft);margin-bottom:7px;}
.id-ex strong{font-weight:600;}
.id-ex em{color:var(--text-muted);font-size:calc(11.5px * var(--scale));font-style:normal;}
.id-tip{background:var(--accent-soft);border-radius:6px;padding:10px 13px;margin-top:14px;font-size:calc(12px * var(--scale));line-height:1.55;color:var(--text);}
.id-tip-hdr{font-size:calc(9px * var(--scale));font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent);margin-bottom:4px;}
.id-done-row{display:flex;align-items:center;gap:10px;padding:16px 0 4px;border-top:1px solid var(--border);margin-top:14px;cursor:pointer;user-select:none;}
.id-done-lbl{font-size:calc(13px * var(--scale));font-weight:600;}
/* ── BOTTOM NAV ── */
.bnav{display:flex;flex-shrink:0;background:var(--bg-panel);border-top:1px solid var(--border);height:calc(54px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);}
.bnav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-muted);font-family:'Inter',sans-serif;padding:6px 0;transition:color 0.15s;}
.bnav-btn.on{color:var(--accent);}
.bnav-ico{font-size:19px;line-height:1;}
.bnav-lbl{font-size:calc(10px * var(--scale));font-weight:600;}
/* ── CITY OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:20;}
.overlay.open{display:block;}
.overlay-panel{position:absolute;right:0;top:0;bottom:0;width:min(88vw,340px);background:var(--bg-panel);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.2s ease;}
.overlay.open .overlay-panel{transform:translateX(0);}
.overlay-head{padding:13px 16px 9px;font-weight:700;font-size:calc(13px * var(--scale));border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.city-inp{background:none;border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);margin:8px 16px 0;width:calc(100% - 32px);}
.city-list-el{overflow-y:auto;flex:1;padding:4px 0;}
.city-btn{width:100%;text-align:left;background:none;border:none;padding:9px 16px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);cursor:pointer;border-left:2px solid transparent;}
.city-btn:active,.city-btn.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);}
</style>
</head>
<body>
<div id="app" data-sect="islam">

<!-- ════════════════════════════
     ISLAM VIEWS
════════════════════════════ -->
<div class="view active" id="vi-home">
  <div class="top-bar">
    <div class="pill" id="iLangPill">
      <button data-lang="pl">PL</button><button data-lang="en">EN</button>
    </div>
    <div class="tb-right">
      <div class="pill" id="iSzPill">
        <button class="sz-btn" data-sc="0.85">A</button>
        <button class="sz-btn" data-sc="1">A</button>
        <button class="sz-btn" data-sc="1.2">A</button>
      </div>
      <button class="icon-btn" id="iThemeBtn">🌓</button>
    </div>
  </div>
  <div class="home-hdr">
    <h1 class="home-title" id="i-appTitle"></h1>
    <p class="home-sub" id="i-appSub"></p>
  </div>
  <div class="pw">
    <div class="pw-head">
      <button class="pw-city" id="pwCityBtn"></button>
      <span class="pw-method" id="pwMethod"></span>
    </div>
    <div class="pw-grid" id="pwGrid"></div>
  </div>
  <div class="list-hdr-row">
    <span class="list-hdr-lbl" id="i-listHdr"></span>
    <button class="sort-btn" id="iSortBtn">↕</button>
  </div>
  <div class="entry-list" id="i-entryList"></div>
</div>

<div class="view" id="vi-list">
  <div class="sub-top">
    <button class="back-btn" id="iBackList">‹</button>
    <span class="sub-ttl" id="i-listTopTtl"></span>
  </div>
  <div class="mini-bar" id="i-mbList"></div>
  <div class="detail-scroll">
    <h2 class="detail-title" id="i-listTitle"></h2>
    <p class="detail-sub" id="i-listSub"></p>
    <div id="i-listBody"></div>
  </div>
</div>

<div class="view" id="vi-letters">
  <div class="sub-top">
    <button class="back-btn" id="iBackLetters">‹</button>
    <span class="sub-ttl" id="i-lettersTopTtl"></span>
  </div>
  <div class="mini-bar" id="i-mbLetters"></div>
  <div class="detail-scroll">
    <h2 class="detail-title" id="i-lettersTitle"></h2>
    <p class="detail-sub" id="i-lettersSub"></p>
    <div id="i-lettersBody"></div>
  </div>
</div>

<div class="view" id="vi-prayer">
  <div class="sub-top">
    <button class="back-btn" id="iBackPrayer">‹</button>
    <span class="sub-ttl" id="i-prayerTopTtl"></span>
  </div>
  <div class="mini-bar" id="i-mbPrayer"></div>
  <div class="prayer-pills">
    <button id="pv2"></button><button id="pv3"></button><button id="pv4"></button>
  </div>
  <div class="pscroll" id="i-prayerScroll"></div>
</div>

<!-- ════════════════════════════
     ENGLISH VIEWS
════════════════════════════ -->
<div class="view" id="ve-home">
  <div class="top-bar">
    <span class="tb-title">🇬🇧 Angielski</span>
    <div class="tb-right">
      <div class="pill" id="eLangPill">
        <button data-lang="pl">PL</button><button data-lang="en">EN</button>
      </div>
      <div class="pill" id="eSzPill">
        <button class="sz-btn" data-sc="0.85">A</button>
        <button class="sz-btn" data-sc="1">A</button>
        <button class="sz-btn" data-sc="1.2">A</button>
      </div>
      <button class="icon-btn" id="eThemeBtn">🌓</button>
    </div>
  </div>
  <div class="home-hdr">
    <h1 class="home-title">Moja Droga</h1>
    <p class="home-sub" id="e-homeSub"></p>
  </div>
  <div class="stats-bar">
    <div class="s-cell"><div class="s-val" id="eStB1">—</div><div class="s-lbl" id="eLblB1">—</div></div>
    <div class="s-div"></div>
    <div class="s-cell"><div class="s-val" id="eStB2">—</div><div class="s-lbl" id="eLblB2">—</div></div>
    <div class="s-div"></div>
    <div class="s-cell"><div class="s-val" id="eStAll">—</div><div class="s-lbl" id="eLblAll">—</div></div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn on" id="tabB1">B1</button>
    <button class="tab-btn" id="tabB2">B2</button>
  </div>
  <div class="entry-list" id="e-topicList"></div>
</div>

<div class="view" id="ve-topic">
  <div class="sub-top">
    <button class="back-btn" id="eBackTopic">‹</button>
    <span class="sub-ttl" id="e-topicTitle"></span>
  </div>
  <div class="entry-list" id="e-itemList"></div>
</div>

<div class="view" id="ve-item">
  <div class="sub-top">
    <button class="back-btn" id="eBackItem">‹</button>
    <span class="sub-ttl" id="e-itemTopTtl"></span>
  </div>
  <div class="id-scroll" id="e-itemScroll"></div>
</div>

<!-- ════════════════════════════
     BOTTOM NAV
════════════════════════════ -->
<nav class="bnav">
  <button class="bnav-btn on" id="bnIslam">
    <span class="bnav-ico">☪️</span>
    <span class="bnav-lbl">Islam</span>
  </button>
  <button class="bnav-btn" id="bnEng">
    <span class="bnav-ico">🇬🇧</span>
    <span class="bnav-lbl" id="bnEngLbl">Angielski</span>
  </button>
</nav>

</div><!-- #app -->

<!-- City overlay -->
<div class="overlay" id="cityOv">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span id="cityOvTitle"></span>
      <button class="icon-btn" id="closeCityBtn">✕</button>
    </div>
    <input type="text" class="city-inp" id="cityInp" autocomplete="off">
    <div class="city-list-el" id="cityListEl"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════
   STATE
══════════════════════════════ */
var ST={sect:'islam',lang:'pl',theme:'light',scale:'1',cityId:'krakow',sortReversed:false,engLevel:'b1',pvVer:'2',done:{}};
try{var _s=localStorage.getItem('mdv3');if(_s)Object.assign(ST,JSON.parse(_s));}catch(e){}
function save(){try{localStorage.setItem('mdv3',JSON.stringify(ST));}catch(e){}}

var APP=document.getElementById('app');

function applyTheme(){document.documentElement.setAttribute('data-theme',ST.theme);}
applyTheme();

function applyScale(){
  document.documentElement.style.setProperty('--scale',ST.scale);
  document.querySelectorAll('.sz-btn').forEach(function(b){
    b.classList.toggle('on',b.dataset.sc===ST.scale);
    b.style.fontSize=b.dataset.sc==='0.85'?'10px':b.dataset.sc==='1'?'12px':'14px';
  });
}
applyScale();

function applySect(){
  APP.setAttribute('data-sect',ST.sect);
  document.getElementById('bnIslam').classList.toggle('on',ST.sect==='islam');
  document.getElementById('bnEng').classList.toggle('on',ST.sect==='eng');
}
applySect();

/* ── PRAYER ENGINE ── */
function doy(y,m,d){return Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,1))/86400000)+1;}
function solCalc(y,m,d){var g=(2*Math.PI/365)*(doy(y,m,d)-1);return{eq:229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g)),dc:0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g)};}
function HA(lat,dc,alt){return Math.acos(Math.max(-1,Math.min(1,(Math.sin(alt*Math.PI/180)-Math.sin(lat*Math.PI/180)*Math.sin(dc))/(Math.cos(lat*Math.PI/180)*Math.cos(dc)))))*180/Math.PI/15;}
function compUTC(y,m,d,lat,lon){var sc=solCalc(y,m,d),noon=12-lon/15-sc.eq/60,aAlt=Math.atan(1/(1+Math.tan(Math.abs(lat*Math.PI/180-sc.dc))))*180/Math.PI;return{fajr:noon-HA(lat,sc.dc,-18),sunrise:noon-HA(lat,sc.dc,-0.833),dhuhr:noon,asr:noon+HA(lat,sc.dc,aAlt),maghrib:noon+HA(lat,sc.dc,-0.833),isha:noon+HA(lat,sc.dc,-17)};}
function lp(tz){var p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-');return{y:+p[0],m:+p[1],d:+p[2]};}
function hToD(y,m,d,h){return new Date(Date.UTC(y,m-1,d)+h*3600000);}
function fmtT(date,tz){return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(date);}
function getPD(){
  var city=getCity(),p=lp(city.tz),raw=compUTC(p.y,p.m,p.d,city.lat,city.lon),times={};
  ['fajr','sunrise','dhuhr','asr','maghrib','isha'].forEach(function(k){times[k]=hToD(p.y,p.m,p.d,raw[k]);});
  var tmr=new Date(Date.UTC(p.y,p.m-1,p.d)+86400000),tp=new Intl.DateTimeFormat('en-CA',{timeZone:city.tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(tmr).split('-'),r2=compUTC(+tp[0],+tp[1],+tp[2],city.lat,city.lon);
  times.fajrTmr=hToD(+tp[0],+tp[1],+tp[2],r2.fajr);
  var now=new Date(),cur=null;
  if(now>=times.fajr&&now<times.sunrise)cur='fajr';else if(now>=times.dhuhr&&now<times.asr)cur='dhuhr';else if(now>=times.asr&&now<times.maghrib)cur='asr';else if(now>=times.maghrib&&now<times.isha)cur='maghrib';else if(now>=times.isha)cur='isha';
  var prayers=['fajr','dhuhr','asr','maghrib','isha'],next=null,nextD=times.fajrTmr;
  for(var j=0;j<prayers.length;j++){if(times[prayers[j]]>now){next=prayers[j];nextD=times[prayers[j]];break;}}
  if(!next){next='fajr';nextD=times.fajrTmr;}
  return{city:city,times:times,cur:cur,next:next,nextD:nextD};
}

  var d=getPD();

    el.innerHTML='<div class="pw-l">'+PL_N[k][ST.lang]+'</div><div class="pw-v">'+fmtT(d.times[k],d.city.tz)+'</div>';

  return d;
}

function openIslamEntry(e){if(e.type==='list')openIslamList(e);else if(e.type==='letters')openIslamLetters();else if(e.type==='prayer')openIslamPrayer();}
function openIslamList(entry){
  document.getElementById('i-listTopTtl').textContent=entry.title[ST.lang];
  document.getElementById('i-listTitle').textContent=entry.title[ST.lang];
  document.getElementById('i-listSub').textContent=entry.sub[ST.lang];
  var body=document.getElementById('i-listBody');body.innerHTML='';
  entry.lines.forEach(function(line,i){
    var row=document.createElement('div');row.className='line-item';
    if(typeof line==='string'&&line.slice(-1)===':'){row.classList.add('li-hdr');row.textContent=line;}
    else if(typeof line!=='string'&&line.pl!==undefined&&String(line.pl).slice(-1)===':'){row.classList.add('li-hdr');row.textContent=rl(line);}
    else if(line&&line.phrase!==undefined){
      var idx=document.createElement('span');idx.className='li-num';idx.textContent=(i+1)+'.';
      row.appendChild(idx);row.appendChild(document.createTextNode(line.phrase));
      var m=document.createElement('div');m.className='li-meaning';m.textContent=line.note[ST.lang];
      row.appendChild(document.createElement('br'));row.appendChild(m);
    }else{
      var idx2=document.createElement('span');idx2.className='li-num';idx2.textContent=(i+1)+'.';
      row.appendChild(idx2);row.appendChild(document.createTextNode(rl(line)));
    }
    body.appendChild(row);
  });
  showV('vi-list');
}

document.getElementById('cityInp').addEventListener('input',function(){renderCityList(this.value);});
function renderCityList(q){
  var el=document.getElementById('cityListEl');el.innerHTML='';
  var qq=q.trim().toLowerCase();
  CITIES.filter(function(c){return !qq||c.name.toLowerCase().indexOf(qq)!==-1;}).forEach(function(c){
    var b=document.createElement('button');b.className='city-btn'+(c.id===ST.cityId?' on':'');b.textContent=c.name;
    b.addEventListener('click',function(){ST.cityId=c.id;save();refreshP();document.getElementById('cityOv').classList.remove('open');});
    el.appendChild(b);
  });
}

    {sec:{pl:'Czasy przeszłe',en:'Past Tenses'},t:{pl:'Past Simple',en:'Past Simple'},

    {sec:{pl:'Przyszłość',en:'Future'},t:{pl:'Will / Won\'t',en:'Will / Won\'t'},
     d:{pl:'Decyzja podjęta W CHWILI mówienia, przewidywanie bez dowodu, obietnica. Tworzenie: will + infinitive.',en:'Decision made AT THE MOMENT of speaking, prediction without evidence, promise. Form: will + bare infinitive.'},

     tip:{pl:'Will ≠ plan! Plan → Going to. "I\'ll call you" (teraz zdecydowałem). "I\'m going to call you" (miałem plan).',en:'Will ≠ plan! Plans → Going to. "I\'ll call you" (deciding now). "I\'m going to call you" (planned before).'}},
    {t:{pl:'Going to',en:'Going to'},
     d:{pl:'Plan podjęty WCZEŚNIEJ lub przewidywanie z widzialnym dowodem. Tworzenie: am/is/are + going to + infinitive.',en:'Intention decided before or prediction based on visible evidence. Form: am/is/are + going to + infinitive.'},

    {sec:{pl:'Tryby warunkowe',en:'Conditionals'},t:{pl:'Conditional 0 — Zero',en:'Zero Conditional'},
     d:{pl:'Fakty naukowe i ogólne prawdy — zawsze prawdziwe. If + Present Simple, + Present Simple.',en:'Scientific facts and general truths — always true. If + Present Simple, + Present Simple.'},
     ex:['If you heat water to 100°C, it boils. — (physics / fizyka)','If I drink too much coffee, I can\'t sleep. — (regular result)','When it rains, the streets get wet. — (when = if)'],
     tip:{pl:'Wynik jest ZAWSZE pewny. "if" można zastąpić "when" bez zmiany sensu.',en:'The result is ALWAYS certain. "if" can be replaced by "when" without changing the meaning.'}},
    {t:{pl:'Conditional 1 — First',en:'First Conditional'},
     d:{pl:'Realne możliwe warunki w przyszłości. If + Present Simple → will + infinitive.',en:'Real, possible future conditions and their likely results. If + Present Simple → will + infinitive.'},
     ex:['If it rains, I\'ll take an umbrella. — (possible condition)','You\'ll be late if you don\'t hurry. — (if at the end)','If she calls, tell her I\'m busy. — (present simple after "if")','Will you help me if I need you?'],
     tip:{pl:'Po "if" → ZAWSZE Present Simple (NIE will). "If it will rain" → BŁĄD! "If it rains" → POPRAWNE.',en:'After "if" → ALWAYS Present Simple (NOT will). "If it will rain" → WRONG! "If it rains" → CORRECT.'}},
    {t:{pl:'Conditional 2 — Second',en:'Second Conditional'},
     d:{pl:'Sytuacje nierealne lub mało prawdopodobne TERAZ. If + Past Simple → would + infinitive.',en:'Unreal or unlikely situations NOW. If + Past Simple → would + infinitive.'},

    {sec:{pl:'Strona bierna',en:'Passive Voice'},t:{pl:'Passive Voice — podstawy',en:'Passive Voice — basics'},
     d:{pl:'Używamy gdy wykonawca jest nieznany lub nieważny. Present Passive: is/are + pp. Past Passive: was/were + pp.',en:'Used when the agent is unknown or unimportant. Present Passive: is/are + pp. Past Passive: was/were + pp.'},
     ex:['English is spoken all over the world. — (Present Simple Passive)','The window was broken by a ball. — (Past Simple Passive)','This building was built in 1920. — (without agent)','These products are made in China.'],

    {sec:{pl:'Modalne',en:'Modal Verbs'},t:{pl:'Can / Could / Be able to',en:'Can / Could / Be able to'},
     d:{pl:'Can: zdolność teraźniejsza. Could: przeszła zdolność lub uprzejma prośba. Be able to: po will lub w czasach Perfect.',en:'Can: present ability. Could: past ability or polite request. Be able to: after will or in Perfect tenses.'},
     ex:['I can swim very fast. — (present ability)','Could you open the window? — (polite request)','She could speak French as a child. — (past ability)','I\'ll be able to help you tomorrow. — (after will)']},
    {t:{pl:'Should / Shouldn\'t',en:'Should / Shouldn\'t'},
     d:{pl:'Rada lub umiarkowany obowiązek. Synonim: ought to (formalniejsze).',en:'Advice or mild obligation. Synonym: ought to (more formal).'},
     ex:['You should see a doctor. — (advice / rada)','He shouldn\'t eat so much sugar.','Should I call her? — (asking for advice)','You ought to apologize. — (ought to = should)']},
    {t:{pl:'Must / Have to / Don\'t have to',en:'Must / Have to / Don\'t have to'},
     d:{pl:'Must: wewnętrzny nakaz. Have to: zewnętrzny obowiązek. Don\'t have to: brak obowiązku (NIE zakaz!). Mustn\'t = zakaz.',en:'Must: internal necessity. Have to: external obligation. Don\'t have to: no obligation (NOT a ban!). Mustn\'t = prohibition.'},
     ex:['I must call mum — it\'s her birthday. — (internal must)','I have to work on Saturdays. — (external obligation)','You don\'t have to wear a tie. — (no obligation)','You mustn\'t smoke here. — (prohibition)'],
     tip:{pl:'KLUCZ: Don\'t have to = brak obowiązku (możesz, ale nie musisz). Mustn\'t = zakaz (nie wolno ci). To NIE to samo!',en:'KEY: Don\'t have to = no obligation (you can but you don\'t need to). Mustn\'t = prohibition. These are NOT the same!'}},
    {t:{pl:'Might / May',en:'Might / May'},

     ex:['It might rain later. — (about 50% possible)','She may not be at home. — (possibility)','Take an umbrella — it might be cold. — (cautious advice)'],
     tip:{pl:'Skala pewności: will (100%) > should (90%) > may/might (50%) > could (30%)',en:'Certainty scale: will (100%) > should (90%) > may/might (50%) > could (30%)'}},
    {sec:{pl:'Inne struktury',en:'Other Structures'},t:{pl:'Reported Speech — podstawy',en:'Reported Speech — basics'},
     d:{pl:'Relacjonowanie czyjejś wypowiedzi. Czasy cofają się o krok. Said/told + obiekt.',en:'Reporting what someone said. Tenses shift back one step. Said/told + object.'},
     ex:['"I am tired." → He said he was tired. — (Present → Past)','"I will call you." → She said she would call. — (will → would)','"I have eaten." → He said he had eaten. — (PP → Past Perfect)','"Don\'t go!" → She told me not to go. — (imperative / rozkaz)'],
     tip:{pl:'Tell → potrzebuje obiektu (told me/him/her). Say → bez obiektu. "She said me" → BŁĄD. "She told me" → OK.',en:'Tell → needs an object (told me/him/her). Say → no object. "She said me" → WRONG. "She told me" → CORRECT.'}},
    {t:{pl:'Relative Clauses — who / which / that',en:'Relative Clauses — who / which / that'},

    {t:{pl:'Gerund vs Infinitive (podstawy)',en:'Gerund vs Infinitive (basics)'},

    {sec:{pl:'Zaawansowane tryby warunkowe',en:'Advanced Conditionals'},t:{pl:'Conditional 3 — Third',en:'Third Conditional'},
     d:{pl:'Żal za niespełnionym warunkiem w PRZESZŁOŚCI. If + Past Perfect → would have + pp.',en:'Regret about an unfulfilled past condition. If + Past Perfect → would have + past participle.'},

    {t:{pl:'Mixed Conditional',en:'Mixed Conditional'},

    {t:{pl:'Wish / If only / I\'d rather',en:'Wish / If only / I\'d rather'},

    {sec:{pl:'Zaawansowana strona bierna',en:'Advanced Passive'},t:{pl:'Passive Voice — wszystkie czasy',en:'Passive Voice — all tenses'},

     ex:['The report has been written. — (Present Perfect Passive)','The bridge will be repaired next year. — (Future Passive)','The house is being painted. — (Present Continuous Passive)','It should be done by Friday. — (Modal Passive)']},
    {t:{pl:'Causative: have / get sth done',en:'Causative: have / get sth done'},

     tip:{pl:'Have sth done = bardziej formalne. Get sth done = potoczne. W obu TY nie robisz — ktoś inny robi dla ciebie.',en:'Have sth done = more formal. Get sth done = more informal. In both cases YOU don\'t do it — someone does it for you.'}},
    {sec:{pl:'Zaawansowana gramatyka',en:'Advanced Grammar'},t:{pl:'Non-defining Relative Clauses',en:'Non-defining Relative Clauses'},
     d:{pl:'Dodatkowa informacja w przecinkach, NIE ogranicza sensu zdania głównego. Zawsze przecinki, nigdy "that".',en:'Extra information in commas, does NOT restrict the main clause. Always commas, never "that".'},
     ex:['My brother, who lives in Gdańsk, is a doctor. — (extra info)','The Eiffel Tower, which was built in 1889, is iconic.','She gave me a lift, which was very kind of her. — (which = the whole action)'],
     tip:{pl:'Usuń klauzulę nieograniczającą → zdanie nadal ma pełny sens. Usuń klauzulę ograniczającą (defining) → zdanie traci sens.',en:'Remove non-defining clause → sentence still makes full sense. Remove defining clause → sentence loses its specific meaning.'}},
    {t:{pl:'Inversion for Emphasis',en:'Inversion for Emphasis'},
     d:{pl:'Inwersja podmiot-orzeczenie dla wzmocnienia lub stylu formalnego. Triggery: Never, Not only, Rarely, Seldom, Hardly.',en:'Subject-verb inversion for emphasis or formal style. Triggers: Never, Not only, Rarely, Seldom, Hardly.'},
     ex:['Never have I seen such a mess. — (Never + aux + subject)','Not only did he lie, but he also stole. — (Not only + did + subject)','Rarely does she make mistakes. — (Rarely + does + subject)','No sooner had I left than it started raining.'],
     tip:{pl:'Formuła: POMOCNIK + podmiot + reszta. Never have I... (nie: Never I have). Typowe w piśmie formalnym.',en:'Formula: AUXILIARY + subject + rest. Never have I... (not: Never I have). Typical in formal writing.'}},
    {t:{pl:'Cleft Sentences',en:'Cleft Sentences'},
     d:{pl:'Wyróżnienie wybranego elementu zdania. Struktury: It is/was... that/who. What... is/was.',en:'Highlighting a specific element. Structures: It is/was... that/who. What... is/was.'},
     ex:['It was John who broke the window. — (not someone else)','It was in Rome that we first met. — (in Rome specifically)','What I need is a long holiday. — (what I need)','What surprised me was his reaction.']},
    {t:{pl:'Participle Clauses',en:'Participle Clauses'},
     d:{pl:'Skracają zdania okolicznikowe. Present participle (doing) lub Past participle (done). Typowe w piśmie formalnym.',en:'Shorten adverbial clauses. Present participle (doing) or past participle (done). Typical in formal writing.'},
     ex:['Seeing the car, she ran away. — (= When she saw the car)','Having finished, he left. — (= After he had finished)','Exhausted by the journey, she went to bed. — (= Because she was exhausted)'],
     tip:{pl:'Participle MUSI dotyczyć podmiotu zdania głównego! "Walking down the street, it started raining" → BŁĄD.',en:'The participle MUST refer to the subject of the main clause! "Walking down the street, it started raining" → WRONG.'}}

   b1:[

     d:{pl:'Zawody: accountant, engineer, nurse, plumber. Czynności: apply for a job, get promoted, resign, be made redundant. Kolokacje: meet a deadline, attend a meeting.',en:'Jobs: accountant, engineer, nurse, plumber. Actions: apply for a job, get promoted, resign, be made redundant. Collocations: meet a deadline, attend a meeting.'},

    {t:{pl:'Pieniądze i zakupy',en:'Money & Shopping'},

var curEngTopic=null;
var curEngItemData=null; // {item, key}

function eKey(topicId,level,idx){return topicId+'_'+level+'_'+idx;}
function tStats(t){
  var b1t=t.b1.length,b1d=0,b2t=t.b2.length,b2d=0;
  t.b1.forEach(function(_,i){if(ST.done[eKey(t.id,'b1',i)])b1d++;});
  t.b2.forEach(function(_,i){if(ST.done[eKey(t.id,'b2',i)])b2d++;});
  return{b1t:b1t,b1d:b1d,b2t:b2t,b2d:b2d};
}
function allEStats(){
  var r={b1t:0,b1d:0,b2t:0,b2d:0};
  TOPICS.forEach(function(t){var s=tStats(t);r.b1t+=s.b1t;r.b1d+=s.b1d;r.b2t+=s.b2t;r.b2d+=s.b2d;});
  return r;
}
function eT(item){return(item.t[ST.lang]||item.t.pl);}
function eD(item){return(item.d[ST.lang]||item.d.pl);}
function eSec(item){if(!item.sec)return null;return(item.sec[ST.lang]||item.sec.pl);}
function eTip(item){if(!item.tip)return null;return(item.tip[ST.lang]||item.tip.pl);}

function renderEngHome(){
  document.querySelectorAll('#eLangPill button').forEach(function(b){b.classList.toggle('on',b.dataset.lang===ST.lang);});
  document.querySelectorAll('#eSzPill .sz-btn').forEach(function(b){b.classList.toggle('on',b.dataset.sc===ST.scale);b.style.fontSize=b.dataset.sc==='0.85'?'10px':b.dataset.sc==='1'?'12px':'14px';});
  document.getElementById('tabB1').classList.toggle('on',ST.engLevel==='b1');
  document.getElementById('tabB2').classList.toggle('on',ST.engLevel==='b2');
  var s=allEStats();
  document.getElementById('eStB1').textContent=s.b1d+'/'+s.b1t;
  document.getElementById('eStB2').textContent=s.b2d+'/'+s.b2t;
  document.getElementById('eStAll').textContent=(s.b1t+s.b2t)+'';
  document.getElementById('e-homeSub').textContent=et('homeSub');
  document.getElementById('eLblB1').textContent=et('b1lbl');
  document.getElementById('eLblB2').textContent=et('b2lbl');
  document.getElementById('eLblAll').textContent=et('totlbl');
  var lv=ST.engLevel;
  var list=document.getElementById('e-topicList');list.innerHTML='';
  TOPICS.forEach(function(t){
    var ts=tStats(t);
    var doneN=lv==='b1'?ts.b1d:ts.b2d;
    var total=lv==='b1'?ts.b1t:ts.b2t;
    var pct=total>0?Math.round(doneN/total*100):0;
    var row=document.createElement('div');row.className='entry-row';
    row.innerHTML='<div class="e-ico">'+t.emoji+'</div>'+
      '<div class="e-body"><div class="e-title">'+t.title[ST.lang]+'</div><div class="e-sub">'+t.sub[ST.lang]+'</div></div>'+
      '<div class="e-right">'+
        '<div class="e-pct">'+doneN+'/'+total+'</div>'+
        '<div class="prog-bar"><div class="prog-fill" id="epf-'+t.id+'" style="width:'+pct+'%"></div></div>'+
        '<span class="e-arr">›</span></div>';
    row.addEventListener('click',function(){openEngTopic(t.id);});
    list.appendChild(row);
  });
}

function openEngTopic(id){
  curEngTopic=TOPICS.find(function(t){return t.id===id;});
  var lv=ST.engLevel;
  document.getElementById('e-topicTitle').textContent=curEngTopic.emoji+' '+curEngTopic.title[ST.lang]+' — '+lv.toUpperCase();
  renderEngItems();
  showV('ve-topic');
}
function renderEngItems(){
  var lv=ST.engLevel;
  var items=lv==='b1'?curEngTopic.b1:curEngTopic.b2;
  var list=document.getElementById('e-itemList');list.innerHTML='';
  var lastSec=null;
  items.forEach(function(item,idx){
    var sec=eSec(item);
    if(sec&&sec!==lastSec){
      var h=document.createElement('div');h.className='topic-sec-hdr';h.textContent=sec;list.appendChild(h);lastSec=sec;
    }
    var ky=eKey(curEngTopic.id,lv,idx);
    var isDone=!!ST.done[ky];
    var row=document.createElement('div');row.className='item-row';
    var chk=document.createElement('div');chk.className='i-chk'+(isDone?' done':'');chk.textContent=isDone?'✓':'';
    var body=document.createElement('div');body.className='i-body';
    var tt=document.createElement('div');tt.className='i-ttl';tt.textContent=eT(item);
    var dd=document.createElement('div');dd.className='i-desc';dd.textContent=eD(item);
    body.appendChild(tt);body.appendChild(dd);
    var arr=document.createElement('span');arr.className='i-arr';arr.textContent='›';
    row.appendChild(chk);row.appendChild(body);row.appendChild(arr);
    (function(ky2,chkEl,item2,idx2){
      row.addEventListener('click',function(){openEngItem(item2,ky2,chkEl);});
    })(ky,chk,item,idx);
    list.appendChild(row);
  });
}

function openEngItem(item,ky,chkRef){
  curEngItemData={item:item,key:ky,chkRef:chkRef};
  document.getElementById('e-itemTopTtl').textContent=eT(item);
  var scroll=document.getElementById('e-itemScroll');scroll.innerHTML='';
  // Title
  var ttEl=document.createElement('div');ttEl.className='id-title';ttEl.textContent=eT(item);
  scroll.appendChild(ttEl);
  // Description
  var ddEl=document.createElement('div');ddEl.className='id-desc';ddEl.textContent=eD(item);
  scroll.appendChild(ddEl);
  // Examples
  if(item.ex&&item.ex.length>0){
    var exHdr=document.createElement('div');exHdr.className='id-shdr';exHdr.textContent=et('ex');
    scroll.appendChild(exHdr);
    item.ex.forEach(function(ex){
      var parts=ex.split(' — ');
      var exEl=document.createElement('div');exEl.className='id-ex';
      var bold=document.createElement('strong');bold.textContent=parts[0];
      exEl.appendChild(bold);
      if(parts[1]){exEl.appendChild(document.createTextNode(' '));var em=document.createElement('em');em.textContent='— '+parts[1];exEl.appendChild(em);}
      scroll.appendChild(exEl);
    });
  }
  // Tip
  var tip=eTip(item);
  if(tip){
    var tipEl=document.createElement('div');tipEl.className='id-tip';
    var tipHdr=document.createElement('div');tipHdr.className='id-tip-hdr';tipHdr.textContent=et('tip');
    tipEl.appendChild(tipHdr);
    tipEl.appendChild(document.createTextNode(tip));
    scroll.appendChild(tipEl);
  }
  // Done row
  var isDone=!!ST.done[ky];
  var doneRow=document.createElement('div');doneRow.className='id-done-row';
  var dChk=document.createElement('div');dChk.className='i-chk'+(isDone?' done':'');dChk.textContent=isDone?'✓':'';
  var dLbl=document.createElement('span');dLbl.className='id-done-lbl';dLbl.textContent=et('markDone');
  doneRow.appendChild(dChk);doneRow.appendChild(dLbl);
  doneRow.addEventListener('click',function(){
    ST.done[ky]=!ST.done[ky];save();
    dChk.className='i-chk'+(ST.done[ky]?' done':'');dChk.textContent=ST.done[ky]?'✓':'';
    if(chkRef){chkRef.className='i-chk'+(ST.done[ky]?' done':'');chkRef.textContent=ST.done[ky]?'✓':'';}
  });
  scroll.appendChild(doneRow);
  showV('ve-item');
}

/* ── ENGLISH EVENTS ── */
document.getElementById('tabB1').addEventListener('click',function(){ST.engLevel='b1';save();renderEngHome();});
document.getElementById('tabB2').addEventListener('click',function(){ST.engLevel='b2';save();renderEngHome();});
document.getElementById('eBackTopic').addEventListener('click',function(){showV('ve-home');renderEngHome();});
document.getElementById('eBackItem').addEventListener('click',function(){showV('ve-topic');renderEngItems();});
document.querySelectorAll('#eLangPill button').forEach(function(b){b.addEventListener('click',function(){ST.lang=b.dataset.lang;save();renderEngHome();});});
document.getElementById('eThemeBtn').addEventListener('click',function(){ST.theme=ST.theme==='dark'?'light':'dark';save();applyTheme();});
document.querySelectorAll('#eSzPill .sz-btn').forEach(function(b){b.addEventListener('click',function(){ST.scale=b.dataset.sc;save();applyScale();});});

/* ── BOTTOM NAV ── */
document.getElementById('bnIslam').addEventListener('click',function(){
  ST.sect='islam';save();applySect();
  var alive=document.querySelector('#vi-home.active,#vi-list.active,#vi-letters.active,#vi-prayer.active');
  if(!alive){showV('vi-home');}
  renderIslam();refreshP();
});
document.getElementById('bnEng').addEventListener('click',function(){
  ST.sect='eng';save();applySect();
  var alive=document.querySelector('#ve-home.active,#ve-topic.active,#ve-item.active');
  if(!alive){showV('ve-home');}
  renderEngHome();
});

/* ══════════════════════════════
   INIT
══════════════════════════════ */
(function init(){
  if(ST.sect==='eng'){
    APP.setAttribute('data-sect','eng');
    document.getElementById('bnIslam').classList.remove('on');
    document.getElementById('bnEng').classList.add('on');
    showV('ve-home');
    renderEngHome();
  } else {
    showV('vi-home');
    renderIslam();
    refreshP();
  }
  setInterval(refreshP,60000);
})();

})();
</script>
