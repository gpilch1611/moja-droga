<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moja Droga</title>
<meta name="theme-color" content="#F4EFE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moja Droga">
<meta name="description" content="Moja Droga — notatnik drogi w islamie (godziny modlitw, wudu, modlitwa krok po kroku) oraz ścieżka nauki angielskiego B1–B2. Działa offline (PWA).">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-sect="islam">

<!-- ════════════════════════════
     ISLAM VIEWS
════════════════════════════ -->
<div class="view active" id="vi-home">
  <div class="top-bar">
    <div class="pill" id="iLangPill">
      <button data-lang="pl">PL</button><button data-lang="en">EN</button>
    </div>
    <div class="tb-right">
      <div class="pill" id="iSzPill">
        <button class="sz-btn" data-sc="0.85">A</button>
        <button class="sz-btn" data-sc="1">A</button>
        <button class="sz-btn" data-sc="1.2">A</button>
      </div>
      <button class="icon-btn" id="iThemeBtn" aria-label="Motyw / Theme">🌓</button>
      <button class="icon-btn" id="iSettingsBtn" aria-label="Ustawienia / Settings">⚙</button>
    </div>
  </div>
  <div class="home-hdr">
    <h1 class="home-title" id="i-appTitle"></h1>
    <p class="home-sub" id="i-appSub"></p>
  </div>
  <div class="pw">
    <div class="pw-head">
      <button class="pw-city" id="pwCityBtn"></button>
      <div class="pw-right">
        <span class="pw-method" id="pwMethod"></span>
        <button class="streak-ico" id="iStatsBtn" aria-label="Postępy / Progress"><span class="si-moon">☾</span><span id="iStreakNum">0</span></button>
      </div>
    </div>
    <div class="pw-grid" id="pwGrid"></div>
  </div>
  <div class="mini-bar" id="i-mbHome"></div>
  <div class="list-hdr-row">
    <span class="list-hdr-lbl" id="i-listHdr"></span>
    <button class="sort-btn" id="iSortBtn" aria-label="Odwróć kolejność / Reverse order">↕</button>
  </div>
  <div class="entry-list" id="i-entryList"></div>
</div>

<div class="view" id="vi-list">
  <div class="sub-top">
    <button class="back-btn" id="iBackList" aria-label="Wstecz / Back">‹</button>
    <span class="sub-ttl" id="i-listTopTtl"></span>
  </div>
  <div class="mini-bar" id="i-mbList"></div>
  <div class="detail-scroll">
    <h2 class="detail-title" id="i-listTitle"></h2>
    <p class="detail-sub" id="i-listSub"></p>
    <div id="i-listBody"></div>
  </div>
</div>

<div class="view" id="vi-letters">
  <div class="sub-top">
    <button class="back-btn" id="iBackLetters" aria-label="Wstecz / Back">‹</button>
    <span class="sub-ttl" id="i-lettersTopTtl"></span>
  </div>
  <div class="mini-bar" id="i-mbLetters"></div>
  <div class="detail-scroll">
    <h2 class="detail-title" id="i-lettersTitle"></h2>
    <p class="detail-sub" id="i-lettersSub"></p>
    <div id="i-lettersBody"></div>
  </div>
</div>

<div class="view" id="vi-prayer">
  <div class="sub-top">
    <button class="back-btn" id="iBackPrayer" aria-label="Wstecz / Back">‹</button>
    <span class="sub-ttl" id="i-prayerTopTtl"></span>
  </div>
  <div class="pbar"><i id="pbarPrayer"></i></div>
  <div class="mini-bar" id="i-mbPrayer"></div>
  <div class="ptrack" id="ptWrap">
    <button class="pt-toggle" id="ptToggle" aria-expanded="false"><span id="ptToggleLbl"></span><b id="ptCount"></b><span class="pt-chev">▾</span></button>
    <div class="ptrack-row" id="ptRow" hidden></div>
  </div>
  <div class="prayer-pills">
    <button id="pv2"></button><button id="pv3"></button><button id="pv4"></button>
  </div>
  <div class="pscroll" id="i-prayerScroll"></div>
</div>

<!-- ════════════════════════════
     ENGLISH VIEWS
════════════════════════════ -->
<div class="view" id="ve-home">
  <div class="top-bar">
    <div class="pill" id="eLangPill">
      <button data-lang="pl">PL</button><button data-lang="en">EN</button>
    </div>
    <div class="tb-right">
      <div class="pill" id="eSzPill">
        <button class="sz-btn" data-sc="0.85">A</button>
        <button class="sz-btn" data-sc="1">A</button>
        <button class="sz-btn" data-sc="1.2">A</button>
      </div>
      <button class="icon-btn" id="eThemeBtn" aria-label="Motyw / Theme">🌓</button>
      <button class="icon-btn" id="eSettingsBtn" aria-label="Ustawienia / Settings">⚙</button>
    </div>
  </div>
  <div class="home-hdr">
    <h1 class="home-title" id="e-homeTitle">Moja Droga</h1>
    <p class="home-sub" id="e-homeSub"></p>
  </div>
  <div id="e-contWrap"></div>
  <div class="stats-bar">
    <div class="s-cell"><div class="s-val" id="eStB1">—</div><div class="s-lbl" id="eLblB1">—</div></div>
    <div class="s-div"></div>
    <div class="s-cell"><div class="s-val" id="eStB2">—</div><div class="s-lbl" id="eLblB2">—</div></div>
    <div class="s-div"></div>
    <div class="s-cell" id="eCellAll"><div class="s-ring"><svg viewBox="0 0 38 38" aria-hidden="true"><circle class="ring-bg" cx="19" cy="19" r="16"/><circle class="ring-fg" id="eRingFg" cx="19" cy="19" r="16"/></svg><div class="s-val" id="eStAll">—</div></div><div class="s-lbl" id="eLblAll">—</div></div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn on" id="tabB1">B1</button>
    <button class="tab-btn" id="tabB2">B2</button>
  </div>
  <div class="entry-list" id="e-topicList"></div>
</div>

<div class="view" id="ve-topic">
  <div class="sub-top">
    <button class="back-btn" id="eBackTopic" aria-label="Wstecz / Back">‹</button>
    <span class="sub-ttl" id="e-topicTitle"></span>
  </div>
  <div class="entry-list" id="e-itemList"></div>
</div>

<div class="view" id="ve-item">
  <div class="sub-top">
    <button class="back-btn" id="eBackItem" aria-label="Wstecz / Back">‹</button>
    <span class="sub-ttl" id="e-itemTopTtl"></span>
  </div>
  <div class="pbar"><i id="pbarItem"></i></div>
  <div class="id-scroll" id="e-itemScroll"></div>
</div>

<!-- ════════════════════════════
     BOTTOM NAV
════════════════════════════ -->
<nav class="bnav">
  <button class="bnav-btn on" id="bnIslam">
    <span class="bnav-ico">☪️</span>
    <span class="bnav-lbl">Islam</span>
  </button>
  <button class="bnav-btn" id="bnEng">
    <span class="bnav-ico">🇬🇧</span>
    <span class="bnav-lbl" id="bnEngLbl">Angielski</span>
  </button>
</nav>

</div><!-- #app -->

<!-- City overlay -->
<div class="overlay" id="cityOv" role="dialog" aria-modal="true">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span id="cityOvTitle"></span>
      <button class="icon-btn" id="closeCityBtn" aria-label="Zamknij / Close">✕</button>
    </div>
    <input type="text" class="city-inp" id="cityInp" autocomplete="off" aria-label="Szukaj miasta / Search city">
    <div class="city-list-el" id="cityListEl"></div>
  </div>
</div>

<!-- Settings overlay -->
<div class="overlay" id="setOv" role="dialog" aria-modal="true">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span id="setOvTitle"></span>
      <button class="icon-btn" id="closeSetBtn" aria-label="Zamknij / Close">✕</button>
    </div>
    <div class="set-row">
      <span class="set-lbl" id="setDataLbl"></span>
      <button class="set-btn" id="exportBtn"></button>
      <button class="set-btn" id="importBtn"></button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
    <div class="set-row" id="installRow" style="display:none;margin-top:12px">
      <span class="set-lbl" id="installLbl"></span>
      <button class="set-btn" id="installBtn"></button>
    </div>
    <div class="set-note" id="setNote"></div>
  </div>
</div>

<!-- Profile overlay -->
<div class="overlay" id="profOv" role="dialog" aria-modal="true">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span id="profTitle"></span>
      <button class="icon-btn" id="closeProfBtn" aria-label="Zamknij / Close">✕</button>
    </div>
    <div class="prof-body" id="profBody"></div>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/islam-data.js"></script>
<script src="js/islam.js"></script>
<script src="js/eng-data.js"></script>
<script src="js/eng.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
</body>
</html>
